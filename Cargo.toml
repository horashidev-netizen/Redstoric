[workspace]
members = [
    "crates/redstoric_common",
    "crates/redstoric_core",
    "crates/redstoric_voxel",
    "crates/redstoric_combat_ai",
    "crates/redstoric_net",
]
resolver = "2"

# Khai báo tập trung, tất cả crate con dùng chung
[workspace.dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_pbr",
    "bevy_asset",
    "bevy_winit",
    "bevy_scene",
    "bevy_gltf",
    "bevy_animation",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_sprite",
    "bevy_audio",
    "vorbis",
    "bevy_gilrs",
    "png",
    "hdr",
    "ktx2",
    "tonemapping_luts",
    "bevy_picking",
    "default_font",
    "x11",
    "wayland",
    "serialize",
    "zstd_rust",
    "bevy_log",
    "reflect_auto_register",
] }
bevy_math  = "0.20.1"
bevy_ecs   = "0.20.1"
noise      = "0.9"
dot_vox   = "5.2.0"
glam      = "0.34.2"
gltf      = "1.4.1"
walkdir   = "2.5.0"
serde_json = "1.0.154"
# Mạng nhiều người chơi trên QUIC. Bản 0.22 dành cho Bevy 0.20.
bevy_quinnet = { version = "0.22", features = ["bincode-messages"] }

# ──────────────────────────────────────────────
[package]
name = "Redstoric"
version = "0.1.0"
edition = "2024"
default-run = "Redstoric"

# Thư viện chứa toàn bộ game: desktop gọi từ src/main.rs, Android nạp trực tiếp (cdylib).
[lib]
name = "redstoric_game"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
bevy               = { workspace = true }
redstoric_common   = { path = "crates/redstoric_common" }
redstoric_core     = { path = "crates/redstoric_core" }
redstoric_voxel    = { path = "crates/redstoric_voxel" }
redstoric_combat_ai = { path = "crates/redstoric_combat_ai" }
redstoric_net      = { path = "crates/redstoric_net" }
dot_vox    = { workspace = true }
walkdir    = { workspace = true }
serde_json = { workspace = true }

# Android: dùng NativeActivity (build bằng `cargo apk build`, xem README mục "Chạy trên điện thoại").
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-native-activity"] }

[package.metadata.android]
package = "org.redstoric.game"
apk_label = "Redstoric"
# Thư mục asset đã lọc nhẹ, sinh bởi tools/pack_mobile_assets.py (bản đầy đủ gần 1 GB, quá nặng cho APK)
assets = "target/mobile_assets"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33

[package.metadata.android.application.activity]
orientation = "landscape"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# dev: link động (build nhanh) + tên kiểu trong thông báo panic. KHÔNG bật khi release.
# Chạy: cargo run --features dev
[features]
dev = ["bevy/dynamic_linking", "bevy/debug"]

# ──────────────────────────────────────────────
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"